packages:
  - packages/*
  - adapters/*
  - apps/*
# pnpm 11 reads settings from this file, not from package.json's "pnpm" field (which is now
# gone), and an unapproved postinstall is a hard failure (`ERR_PNPM_IGNORED_BUILDS`) rather
# than a warning — that is what killed CI. esbuild is the one that must run: Vite links its
# native binary, so silently skipping it would break `pnpm -F @agentlens/web build` anyway.
allowBuilds:
  # es5-ext arrives through svelte-i18n -> cli-color. Its postinstall only prints a
  # donation notice, and pnpm 11 fails the install over a script left undecided —
  # which is exactly how esbuild broke CI — so it is declined by name, not by silence.
  es5-ext: false
  esbuild: true

# GitHub flags esbuild <=0.24.2 (a dev server that lets any website make it send requests);
# the only copy under that line arrives through svelte-i18n -> esbuild@0.19.2, an upstream pin
# we do not control. Lifting it to the range Vite already uses keeps ONE esbuild in the tree
# instead of downgrading Vite's, and clears the advisory without waiting on svelte-i18n.
overrides:
  esbuild: '>=0.25.0'
