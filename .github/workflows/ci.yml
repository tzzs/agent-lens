name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # Reconciliation with ccusage (docs/plan-v2.md §15 M3) runs against a machine that has agent
  # logs, so it is a fixture-driven test rather than a hosted CI job: packages/*/test keeps the
  # committed baseline in docs/research honest.
