name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Release Please derives changelogs and version bumps from squash-merged commit messages,
      # which are the PR titles on this repo — so the title is the gate.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            chore
            perf
          subjectPattern: ^[a-z0-9].{2,}$
          subjectPatternError: PR title subject must start with a lowercase letter or digit and be at least 3 characters.

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @agentlens/web build

  # Reconciliation with ccusage (docs/plan-v2.md §15 M3) runs against a machine that has agent
  # logs, so it is a fixture-driven test rather than a hosted CI job: packages/*/test keeps the
  # committed baseline in docs/research honest.
